<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>📝 My To-Do List</h1>

    <div class="input-box">
      <input type="text" id="taskInput" placeholder="Naya task likhein...">
      <button id="addBtn">Add</button>
    </div>

    <ul id="taskList"></ul>

    <p class="counter" id="counter">0 tasks baaki hain</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
